<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таблица зданий</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <form id="filter-form">
      <p>
        <label for="structure">Название:</label>
        <input type="text" id="structure" />
      </p>
      <p>
        <label for="category">Тип:</label>
        <input type="text" id="category" />
      </p>
      <p>
        <label for="country">Страна:</label>
        <input type="text" id="country" />
      </p>
      <p>
        <label for="city">Город:</label>
        <input type="text" id="city" />
      </p>
      <p>
        <label for="yearFrom">Год: </label>
        от <input type="number" id="yearFrom" /> до
        <input type="number" id="yearTo" />
      </p>
      <p>
        <label for="heightFrom">Высота:</label>
        от <input type="number" id="heightFrom" /> до
        <input type="number" id="heightTo" />
      </p>
      <button type="submit">Найти</button>
      <button type="button" id="clear-filter">Очистить фильтры</button>
    </form>

    <form id="sort-form">
      <p>Сортировать по</p>
      <p>
        <select id="fieldsFirst"></select>
        по убыванию? <input type="checkbox" id="fieldsFirstDesc" />
      </p>
      <p>
        <select id="fieldsSecond"></select>
        по убыванию? <input type="checkbox" id="fieldsSecondDesc" />
      </p>
      <button type="button" id="sort-button">Сортировать</button>
      <button type="button" id="reset-sort">Сбросить сортировку</button>
    </form>

    <div id="buildings-table-container"></div>

    <script src="js/data.js"></script>
    <script src="js/table.js"></script>
    <script src="js/filter.js"></script>
    <script src="js/sort.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
