        function initializeTable() {
          updateTable(originalData);
        }

        function updateTable(data) {
          const tableBody = document.querySelector("table tbody");
          tableBody.innerHTML = "";

          data.forEach((item) => {
            const row = document.createElement("tr");
            row.innerHTML = `
            <td>${item.distribution}</td>
            <td>${item.releaseYear}</td>
            <td>${item.usersCount.toLocaleString()}</td>
            <td>${item.dailyDownloads.toLocaleString()}</td>
            <td>${item.packetManager}</td>
          `;
            tableBody.appendChild(row);
          });
        }

        function applyFilters() {
          const nameFilter = document
            .getElementById("filter-name")
            .value.toLowerCase();
          const yearMin =
            parseInt(document.getElementById("filter-year-min").value) || 0;
          const yearMax =
            parseInt(document.getElementById("filter-year-max").value) ||
            Infinity;
          const usersMin =
            parseInt(document.getElementById("filter-users-count-min").value) ||
            0;
          const usersMax =
            parseInt(document.getElementById("filter-users-count-max").value) ||
            Infinity;
          const downloadsMin =
            parseInt(document.getElementById("filter-downloads-min").value) ||
            0;
          const downloadsMax =
            parseInt(document.getElementById("filter-downloads-max").value) ||
            Infinity;

          return originalData.filter((item) => {
            return (
              item.distribution.toLowerCase().includes(nameFilter) &&
              item.releaseYear >= yearMin &&
              item.releaseYear <= yearMax &&
              item.usersCount >= usersMin &&
              item.usersCount <= usersMax &&
              item.dailyDownloads >= downloadsMin &&
              item.dailyDownloads <= downloadsMax
            );
          });
        }

        function applySorting(data) {
          const sort1 = document.getElementById("sort-1").value;
          const sort1Order = document.querySelector(
            'input[name="sort-1-order"]:checked',
          ).value;
          const sort2 = document.getElementById("sort-2").value;
          const sort2Order = document.querySelector(
            'input[name="sort-2-order"]:checked',
          ).value;
          const sort3 = document.getElementById("sort-3").value;
          const sort3Order = document.querySelector(
            'input[name="sort-3-order"]:checked',
          ).value;

          return data.sort((a, b) => {
            let result = compareValues(a[sort1], b[sort1], sort1Order);
            if (result !== 0) return result;

            result = compareValues(a[sort2], b[sort2], sort2Order);
            if (result !== 0) return result;

            return compareValues(a[sort3], b[sort3], sort3Order);
          });
        }

        function compareValues(a, b, order) {
          if (a < b) return order === "asc" ? -1 : 1;
          if (a > b) return order === "asc" ? 1 : -1;
          return 0;
        }

        function updateSortOptions() {
          const sort1 = document.getElementById("sort-1");
          const sort2 = document.getElementById("sort-2");
          const sort3 = document.getElementById("sort-3");

          const selected1 = sort1.value;
          const selected2 = sort2.value;
          const selected3 = sort3.value;

          Array.from(sort2.options).forEach((opt) => (opt.style.display = ""));
          Array.from(sort3.options).forEach((opt) => (opt.style.display = ""));

          if (selected1) {
            sort2.querySelector(`option[value="${selected1}"]`).style.display =
              "none";
            sort3.querySelector(`option[value="${selected1}"]`).style.display =
              "none";
          }
          if (selected2) {
            sort3.querySelector(`option[value="${selected2}"]`).style.display =
              "none";
          }
        }

        function resetFilters() {
          document.getElementById("filter-name").value = "";
          document.getElementById("filter-year-min").value = "";
          document.getElementById("filter-year-max").value = "";
          document.getElementById("filter-users-count-min").value = "";
          document.getElementById("filter-users-count-max").value = "";
          document.getElementById("filter-downloads-min").value = "";
          document.getElementById("filter-downloads-max").value = "";

          updateTable(originalData);
        }

        function applyFiltersAndSorting() {
          const filteredData = applyFilters();
          const sortedData = applySorting(filteredData);
          updateTable(sortedData);
        }

        function generateChart(e) {
          e.preventDefault();
          const xAxis = document.getElementById("x-axis").value;
          const yAxis = document.getElementById("y-axis").value;

          const currentData = applySorting(applyFilters());

          let chartData = "Chart Data:\n\n";
          currentData.forEach((item) => {
            chartData += `${item[xAxis]}: ${item[yAxis]}\n`;
          });

          alert(chartData);
        }

        document.addEventListener("DOMContentLoaded", function () {
          initializeTable();
          updateSortOptions();

          document
            .getElementById("apply-filter")
            .addEventListener("click", applyFiltersAndSorting);
          document
            .getElementById("reset-filter")
            .addEventListener("click", resetFilters);

          document.querySelectorAll('select[id^="sort-"]').forEach((select) => {
            select.addEventListener("change", function () {
              updateSortOptions();
              applyFiltersAndSorting();
            });
          });

          document
            .querySelectorAll('input[name$="-order"]')
            .forEach((radio) => {
              radio.addEventListener("change", applyFiltersAndSorting);
            });

          document
            .getElementById("chart-form")
            .addEventListener("submit", generateChart);
        });
